# The API behind an nginx reverse proxy. No database and no volumes:
# the service keeps nothing between requests, so a redeploy is only a
# rebuild -- there is no data to migrate, back up or restore.
#
#   docker compose up -d --build
#
# The API is then on http://<server>/ (proxied to uvicorn on 8000).
# The front end is deployed separately, so it calls this API
# cross-origin: create a .env file next to this one with CORS_ORIGINS
# before deploying, or the browser will block every request.

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      # The deployed front end's origin, e.g. https://invoices.example.com
      # Comma-separated for more than one. Scheme, host and port must
      # match exactly -- https://x.com and https://x.com:443 do not.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      # Try 1 on Linux to speed inference up, then confirm OCR still
      # returns text -- it silently breaks detection on Windows.
      PADDLE_ENABLE_MKLDNN: "0"
      # tiny | small | medium. The main speed/accuracy lever; see the
      # measured timings in paddleOcr.py before raising it. Changing this
      # needs a rebuild, since the Dockerfile bakes in the matching models.
      OCR_MODEL_SIZE: tiny

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
