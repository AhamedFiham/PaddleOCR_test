# Reverse proxy in front of the API. It exists for three reasons the
# app server cannot handle on its own: large uploads, very long request
# times, and TLS termination.
server {
    listen 80;
    server_name _;

    # Invoice PDFs and phone photos are large; the default 1MB cap would
    # reject them with a 413 before they reach the API.
    client_max_body_size 50m;

    location / {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A single extract runs 100-250s on CPU. The 60s default would
        # cut the connection mid-OCR and surface to the front end as a
        # 504 with no explanation.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Stream the upload through rather than buffering it to disk.
        proxy_request_buffering off;

        # CORS headers come from the app (FastAPI's CORSMiddleware), not
        # from here. Adding them in both places produces duplicated
        # headers, which browsers reject outright.
    }
}
